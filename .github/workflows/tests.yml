name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: pytest
        env:
          DATABASE_URL: "postgresql://user:password@ep-example.us-east-2.aws.neon.tech/neondb?sslmode=require"
          GEMINI_API_KEY: "dummy_api_key"
          OBSERVER_LATITUDE: "43.5890"
          OBSERVER_LONGITUDE: "-79.6441"
          OBSERVER_ELEVATION_M: "115.0"
          OBSERVER_TIMEZONE: "America/Toronto"
